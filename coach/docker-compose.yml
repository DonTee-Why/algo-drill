services:
  coach:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: algo-drill-coach
    restart: unless-stopped
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - algo-drill-network

networks:
  algo-drill-network:
    external: true
    name: algo-drill-network
